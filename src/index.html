<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Jeremy Schmidt" />
    <meta name="keywords" content="html, coffee, css, Triple Peaks Library" />
    <meta name="description" content="A webpage about coffee and a library" />
    <title>Spots</title>
    <!-- /////////////////////////<link rel="stylesheet" href="pages/index.css" /> -->
    <!-- //////<link rel="shortcut icon" href="favicon.ico" type="image/x-icon" /> -->
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="<%= require('./images/logo.svg') %>"
          alt="Spots logo image"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button class="profile__avatar-btn">
              <img
                src="<%= require('./images/pencil.svg') %>"
                alt="Pencil icon"
                class="profile__avatar-btn-image"
              />
            </button>
            <img
              src="<%= require('./images/avatar.png') %>"
              alt="Bessie avatar image"
              class="profile__avatar"
            />
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-btn">
              <img
                src="<%= require('./images/pencil.svg') %>"
                alt="Pencil icon"
                class="profile__edit-btn-image"
              />
              Edit Profile
            </button>
          </div>
          <button type="button" class="profile__add-btn">
            <img
              src="<%= require('./images/plus-icon.svg') %>"
              alt="Plus icon"
              class="profile__add-btn-image"
            />
            New Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button type="button" class="card__delete-btn"></button>
                <img src="#" alt="" class="card__image" />
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button type="button" class="card__like-btn"></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__copyright">2023 &copy; Spots</p>
      </footer>
      <!-- PROFILE MODAL -->
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <h2 class="modal__title">Edit profile</h2>
          <button type="button" class="modal__close-btn"></button>
          <form class="modal__form" id="edit-profile-form" novalidate>
            <label for="profile-name-input" class="modal__label"
              >Name
              <input
                id="profile-name-input"
                type="text"
                class="modal__input"
                placeholder="Type your name"
                minlength="2"
                maxlength="40"
                required
              />
              <span
                class="form__input-error"
                id="profile-name-input-error"
              ></span>
            </label>
            <label for="profile-dscrptn-input" class="modal__label"
              >Description
              <input
                id="profile-dscrptn-input"
                type="text"
                class="modal__input"
                placeholder="Describe yourself"
                minlength="2"
                maxlength="200"
                required
              />
              <span
                class="form__input-error"
                id="profile-dscrptn-input-error"
              ></span>
            </label>
            <button
              type="submit"
              class="modal__submit-btn"
              id="profile-submit-btn"
            >
              Save
            </button>
          </form>
        </div>
      </div>
      <!-- NEW POST MODAL -->
      <div class="modal" id="new-post-modal">
        <div class="modal__bg-overlay"></div>
        <div class="modal__container">
          <h2 class="modal__title">New post</h2>
          <button type="button" class="modal__close-btn"></button>
          <form class="modal__form" id="new-post-form" novalidate>
            <label for="card-image-input" class="modal__label"
              >Image link
              <input
                id="card-image-input"
                type="url"
                class="modal__input"
                placeholder="Paste a link to the picture"
                required
              />
              <span
                class="form__input-error"
                id="card-image-input-error"
              ></span>
            </label>
            <label for="card-caption-input" class="modal__label"
              >Caption
              <input
                id="card-caption-input"
                type="text"
                class="modal__input"
                placeholder="Type your caption"
                minlength="2"
                maxlength="30"
                required
              />
              <span
                class="form__input-error"
                id="card-caption-input-error"
              ></span>
            </label>
            <button
              type="submit"
              class="modal__submit-btn"
              id="post-submit-btn"
            >
              Save
            </button>
          </form>
        </div>
      </div>
      <!-- PREVIEW MODAL-->
      <div class="modal" id="preview-modal">
        <div class="modal__preview-content">
          <button
            type="button"
            class="modal__close-btn modal__close-btn_type_preview"
          ></button>
          <img class="modal__preview-image" src="#" alt="" />
          <p class="modal__caption"></p>
        </div>
      </div>
      <!-- DELETE CARD MODAL-->
      <div class="modal" id="delete-modal">
        <div class="modal__delete-content">
          <div class="modal__bg-overlay"></div>
          <h2 class="modal__delete_title">
            Are you sure you want to delete this image?
          </h2>
          <button type="button" class="modal__delete-btn">Delete</button>
          <button type="button" class="modal__cancel-delete-btn">Delete</button>
        </div>
      </div>
    </div>
  </body>
</html>
